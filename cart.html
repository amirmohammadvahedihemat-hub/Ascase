<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید | ASCASE V2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-wrap">
    <a href="index.html" class="logo"><span class="logo-mark"></span>ASCASE</a>
    <nav class="nav-items"><a href="cart.html" class="active">سبد خرید</a></nav>
    <div style="flex:1;"></div>
    <div class="header-actions"><button class="icon-btn dark-toggle">☀️/🌙</button></div>
  </div>
</header>

<section class="section">
  <div class="section-head">
    <div class="eyebrow">🛒 سبد خرید</div>
    <h2>سفارش شما</h2>
  </div>

  <div id="cart-area" style="display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:start;">
    <div id="cart-items" style="display:flex;flex-direction:column;gap:16px;"></div>
    <div style="background:var(--glass-bg);border:1px solid var(--border);border-radius:16px;padding:24px;position:sticky;top:100px;">
      <h3 style="margin:0 0 20px;font-size:1.1rem;">خلاصه</h3>
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:.9rem;">
        <span style="color:var(--text-secondary);">مجموع</span>
        <span id="cart-total" style="font-family:var(--font-mono);font-weight:700;">0</span>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:20px;">ادامه به تسویه</button>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-bottom"><span>© 2026 ASCASE V2</span></div>
</footer>

<script src="products-data.js"></script>
<script src="app.js"></script>
<script>
function renderCart(){
  const cart = getCart();
  const el = document.getElementById('cart-items');
  if(!cart.length){
    el.innerHTML = `<div style="background:var(--glass-bg);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;">
      <p style="margin:0;color:var(--text-secondary);">سبد خریدتون خالیه</p>
      <a href="products.html" class="btn btn-primary" style="margin-top:16px;">مشاهده محصولات</a>
    </div>`;
  } else {
    el.innerHTML = cart.map(item => {
      const p = PRODUCTS.find(p => p.id === item.id);
      if(!p) return '';
      return `
      <div style="background:var(--glass-bg);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;gap:16px;">
        <div style="width:80px;height:80px;border-radius:12px;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;">
          ${svgIcon(p.icon, p.accent)}
        </div>
        <div style="flex:1;">
          <h4 style="margin:0;font-size:.95rem;">${p.name}</h4>
          <p style="color:var(--text-secondary);font-size:.8rem;margin:4px 0;">${categoryTitle(p.cat)}</p>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button onclick="setQty('${p.id}',${item.qty-1})" style="width:28px;height:28px;border:none;border-radius:6px;background:var(--bg-secondary);cursor:pointer;">−</button>
            <span style="width:28px;text-align:center;">${item.qty}</span>
            <button onclick="setQty('${p.id}',${item.qty+1})" style="width:28px;height:28px;border:none;border-radius:6px;background:var(--bg-secondary);cursor:pointer;">+</button>
          </div>
        </div>
        <div style="text-align:right;">
          <span style="font-family:var(--font-mono);font-weight:700;font-size:.9rem;">${fmtPrice(p.price * item.qty)}</span>
          <button onclick="removeFromCart('${p.id}')" style="display:block;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.2rem;margin-top:6px;">×</button>
        </div>
      </div>`;
    }).join('');
  }
  const total = getCart().reduce((s,i) => s + (PRODUCTS.find(p=>p.id===i.id)?.price || 0) * i.qty, 0);
  document.getElementById('cart-total').textContent = fmtPrice(total) + ' تومان';
}

function setQty(id, qty){
  if(qty <= 0) removeFromCart(id);
  else{
    const cart = getCart();
    const item = cart.find(i => i.id === id);
    if(item) item.qty = qty;
    saveCart(cart);
  }
  renderCart();
}

function removeFromCart(id){
  let cart = getCart().filter(i => i.id !== id);
  saveCart(cart);
  renderCart();
}

renderCart();
</script>
</body>
</html>
