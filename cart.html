<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید | ASCASE</title>
<link rel="stylesheet" href="style.css">
<script src="products-data.js"></script>
<script src="cart.js"></script>
<script src="main.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><span class="mark"></span>ASCASE</a>
    <nav class="main-nav">
      <a href="index.html">خانه</a>
      <a href="products.html">محصولات</a>
      <a href="products.html?cat=cases">کاور گوشی</a>
      <a href="gallery.html">نمونه کار</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-btn" aria-label="سبد خرید">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        <span class="cart-count">0</span>
      </a>
      <button class="nav-toggle" aria-label="منو"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="wrap">
  <div class="section-head">
    <div><span class="eyebrow" style="justify-content:flex-start;">YOUR CART</span><h2>سبد خرید</h2></div>
  </div>

  <div id="cart-wrap" style="display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:start;">
    <div id="cart-list" style="display:flex;flex-direction:column;gap:14px;"></div>

    <div class="card" id="summary-card">
      <h3 style="font-size:1.05rem;">جمع سفارش</h3>
      <div class="flex" style="justify-content:space-between;margin-top:18px;font-size:.92rem;">
        <span class="text-mist">قیمت کالاها</span><span class="mono" id="sum-subtotal">0</span>
      </div>
      <div class="flex" style="justify-content:space-between;margin-top:10px;font-size:.92rem;">
        <span class="text-mist">هزینه ارسال</span><span class="mono" id="sum-shipping">۰</span>
      </div>
      <div class="flex" style="justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-weight:700;">
        <span>مبلغ قابل پرداخت</span><span class="mono" id="sum-total">0</span>
      </div>
      <a href="checkout.html" class="btn btn-signal btn-block" style="margin-top:20px;" id="checkout-btn">ادامه و تسویه حساب</a>
      <a href="products.html" class="btn btn-outline btn-block" style="margin-top:10px;">ادامه خرید</a>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
      <span>© 2026 ASCASE — ALL RIGHTS RESERVED</span>
      <span>MADE FOR THOSE WHO DROP THEIR PHONE</span>
    </div>
  </div>
</footer>

<script>
function renderCart(){
  const cart = getCart();
  const listEl = document.getElementById("cart-list");

  if(!cart.length){
    listEl.innerHTML = `<div class="empty-state card">
      <p>سبد خریدتون خالیه.</p>
      <a href="products.html" class="btn btn-dark" style="margin-top:14px;">مشاهده محصولات</a>
    </div>`;
    document.getElementById("checkout-btn").classList.add("disabled");
    document.getElementById("checkout-btn").style.pointerEvents = "none";
    document.getElementById("checkout-btn").style.opacity = ".5";
  } else {
    listEl.innerHTML = cart.map(item => {
      const p = PRODUCTS.find(p => p.id === item.id);
      if(!p) return "";
      return `
      <div class="card" style="display:flex;gap:16px;align-items:center;">
        <a href="product.html?id=${p.id}" style="width:84px;height:84px;flex:none;background:var(--ceramic);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:10px;">
          ${svgIcon(p.icon, p.accent)}
        </a>
        <div style="flex:1;">
          <a href="product.html?id=${p.id}"><h4 style="font-size:.98rem;">${p.name}</h4></a>
          <span class="text-mist mono" style="font-size:.72rem;">${categoryTitle(p.cat)}</span>
          <div class="flex" style="justify-content:space-between;margin-top:10px;align-items:center;">
            <div class="flex" style="border:1px solid var(--line);border-radius:8px;overflow:hidden;">
              <button data-act="minus" data-id="${p.id}" style="width:30px;height:34px;background:var(--ceramic);border:none;">−</button>
              <span class="mono" style="width:32px;text-align:center;font-size:.85rem;">${item.qty}</span>
              <button data-act="plus" data-id="${p.id}" style="width:30px;height:34px;background:var(--ceramic);border:none;">+</button>
            </div>
            <span class="price mono">${fmtPrice(p.price * item.qty)}<small>تومان</small></span>
          </div>
        </div>
        <button data-act="remove" data-id="${p.id}" aria-label="حذف" style="background:none;border:none;color:var(--mist);font-size:1.2rem;flex:none;">×</button>
      </div>`;
    }).join("");
  }

  const subtotal = cartTotal();
  const shipping = subtotal > 0 ? 49000 : 0;
  document.getElementById("sum-subtotal").textContent = fmtPrice(subtotal) + " تومان";
  document.getElementById("sum-shipping").textContent = shipping ? fmtPrice(shipping) + " تومان" : "رایگان";
  document.getElementById("sum-total").textContent = fmtPrice(subtotal + shipping) + " تومان";

  document.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const cart = getCart();
      const item = cart.find(i => i.id === id);
      if(act === "remove") removeFromCart(id);
      else if(act === "plus" && item) setQty(id, item.qty + 1);
      else if(act === "minus" && item) { if(item.qty <= 1) removeFromCart(id); else setQty(id, item.qty - 1); }
      renderCart();
    });
  });
}

renderCart();
</script>
</body>
</html>
