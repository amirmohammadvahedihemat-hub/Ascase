<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محصولات | ASCASE V2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-wrap">
    <a href="index.html" class="logo"><span class="logo-mark"></span>ASCASE</a>
    <nav class="nav-items">
      <a href="index.html">خانه</a>
      <a href="products.html" class="active">محصولات</a>
      <a href="gallery.html">نمونه کار</a>
      <a href="about.html">درباره</a>
    </nav>
    <div class="search-container">
      <input type="text" class="search-input" placeholder="جستجو...">
      <div class="search-results"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn dark-toggle" aria-label="تغییر تم">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a href="cart.html" class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        <span class="badge" style="display:none;">0</span>
      </a>
    </div>
  </div>
</header>

<section class="section">
  <div class="section-head">
    <div class="eyebrow">🛍️ خرید</div>
    <h2 id="page-title">تمام محصولات</h2>
  </div>

  <div style="margin-bottom:32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
    <div id="filter-chips" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    <select id="sort" style="padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-primary);color:var(--text-primary);cursor:pointer;font-family:inherit;">
      <option value="default">مرتب‌سازی پیش‌فرض</option>
      <option value="price-asc">ارزان‌ترین</option>
      <option value="price-desc">گران‌ترین</option>
      <option value="new">جدید‌ترین</option>
    </select>
  </div>

  <div class="grid grid-4" id="products-list"></div>
</section>

<footer class="site-footer">
  <div class="footer-grid">
    <div><div class="logo" style="margin-bottom:14px;"><span class="logo-mark"></span>ASCASE V2</div></div>
    <div><h4>محصولات</h4><ul><li><a href="products.html?cat=cases">کاور</a></li></ul></div>
    <div><h4>شرکت</h4><ul><li><a href="about.html">درباره</a></li></ul></div>
    <div><h4>تماس</h4><ul><li>+98 912 000 0000</li></ul></div>
  </div>
  <div class="footer-bottom">
    <span>© 2026 ASCASE V2</span>
  </div>
</footer>

<script src="products-data.js"></script>
<script src="app.js"></script>
<script>
function getQueryParam(n){ return new URLSearchParams(location.search).get(n); }

function renderPage(){
  let cat = getQueryParam('cat') || 'all';
  let sort = document.getElementById('sort').value;
  let list = cat === 'all' ? PRODUCTS.slice() : PRODUCTS.filter(p => p.cat === cat);

  if(sort === 'price-asc') list.sort((a,b) => a.price - b.price);
  if(sort === 'price-desc') list.sort((a,b) => b.price - a.price);
  if(sort === 'new') list.reverse();

  document.getElementById('page-title').textContent = cat === 'all' ? 'تمام محصولات' : categoryTitle(cat);
  renderProducts(list, '#products-list');

  document.querySelectorAll('#filter-chips .filter-chip').forEach(c => {
    c.style.borderColor = c.dataset.cat === cat ? 'var(--accent)' : 'var(--border)';
    c.style.background = c.dataset.cat === cat ? 'rgba(255,94,58,.1)' : 'transparent';
  });
}

document.getElementById('filter-chips').innerHTML = 
  `<button class="filter-chip" data-cat="all" style="padding:8px 14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:transparent;color:var(--text-primary);transition:all .2s;">همه</button>` +
  CATEGORIES.map(c => `<button class="filter-chip" data-cat="${c.key}" style="padding:8px 14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:transparent;color:var(--text-primary);transition:all .2s;">${c.title}</button>`).join('');

document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    const url = new URL(location.href);
    if(btn.dataset.cat === 'all') url.searchParams.delete('cat');
    else url.searchParams.set('cat', btn.dataset.cat);
    history.pushState({}, '', url);
    renderPage();
  });
});

document.getElementById('sort').addEventListener('change', renderPage);
renderPage();
</script>
</body>
</html>
